; PlatformIO Project Configuration File for Dual-LRS
; STM32F411CEU6 (BlackPill) + Ebyte E22-900T30D LoRa Telemetry System

[platformio]
default_envs = dual_lrs_air, dual_lrs_ground

[env]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = dfu
monitor_speed = 115200

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
    -D ENABLE_HWSERIAL2
    -O2
    -std=gnu++17
    -I include

[env:dual_lrs_air]
build_flags = 
    ${env.build_flags}
    -D DUAL_LRS_ROLE_AIR=1

[env:dual_lrs_ground]
build_flags = 
    ${env.build_flags}
    -D DUAL_LRS_ROLE_GROUND=1
