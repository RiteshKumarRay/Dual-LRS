; PlatformIO Project Configuration File for Dual-LRS
; STM32F411CEU6 (BlackPill) / ESP32 + Ebyte E22-900T30D LoRa Telemetry System

[platformio]
default_envs = dual_lrs_air, dual_lrs_ground, dual_lrs_ground_esp32

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<diag_main.cpp>

[stm32_base]
platform = ststm32
board = blackpill_f411ce
upload_protocol = dfu
build_flags =
    -D ENABLE_HWSERIAL2
    -D SERIAL_RX_BUFFER_SIZE=512
    -D SERIAL_TX_BUFFER_SIZE=256
    -O2
    -std=gnu++17
    -I include

[stm32_usb_base]
extends = stm32_base
build_flags =
    ${stm32_base.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED

[env:dual_lrs_air]
extends = stm32_base
build_flags =
    ${stm32_base.build_flags}
    -D DUAL_LRS_ROLE_AIR=1
    -D ENABLE_HWSERIAL6

[env:dual_lrs_ground]
extends = stm32_usb_base
build_flags =
    ${stm32_usb_base.build_flags}
    -D DUAL_LRS_ROLE_GROUND=1

[env:dual_lrs_ground_esp32]
platform = espressif32
board = esp32dev
board_build.flash_mode = dio
upload_speed = 115200
build_flags =
    -D DUAL_LRS_ROLE_GROUND=1
    -O2
    -std=gnu++17
    -I include

[env:diag_air]
extends = stm32_usb_base
build_flags =
    ${stm32_usb_base.build_flags}
    -D DUAL_LRS_ROLE_AIR=1
    -D DUAL_LRS_DIAG=1
build_src_filter = -<*> +<diag_main.cpp> +<e22_driver.cpp> +<transport_engine.cpp>

[env:diag_ground_esp32]
platform = espressif32
board = esp32dev
board_build.flash_mode = dio
upload_speed = 115200
build_flags =
    -D DUAL_LRS_ROLE_GROUND=1
    -D DUAL_LRS_DIAG=1
    -O2
    -std=gnu++17
    -I include
build_src_filter = -<*> +<diag_main.cpp> +<e22_driver.cpp> +<transport_engine.cpp>

[env:test_air_crsf_uart]
extends = stm32_base
build_flags =
    ${stm32_base.build_flags}
    -D DUAL_LRS_ROLE_AIR=1
    -D ENABLE_HWSERIAL6
build_src_filter = -<*> +<../tools/test_air_crsf_uart.cpp>

[env:test_production_mavlink_transport]
platform = native
framework =
build_type = debug
build_flags =
    -std=c++17
    -DDUAL_LRS_STAGE31_RC_ONLY=0
    -I include
    -I tools/mock_arduino
build_src_filter =
    -<*>
    +<../tools/test_production_mavlink_transport.cpp>
    +<tdm_engine.cpp>
    +<transport_engine.cpp>
