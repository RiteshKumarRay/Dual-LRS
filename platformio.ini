; PlatformIO Project Configuration File for Dual-LRS
; STM32F411CEU6 (BlackPill) / ESP32 + Ebyte E22-900T30D LoRa Telemetry System

[platformio]
default_envs = dual_lrs_air, dual_lrs_ground, dual_lrs_ground_esp32

[env]
framework = arduino
monitor_speed = 115200

[stm32_base]
platform = ststm32
board = blackpill_f411ce
upload_protocol = dfu
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    -D HAL_PCD_MODULE_ENABLED
    -D ENABLE_HWSERIAL2
    -D SERIAL_RX_BUFFER_SIZE=512
    -D SERIAL_TX_BUFFER_SIZE=256
    -O2
    -std=gnu++17
    -I include

[env:dual_lrs_air]
extends = stm32_base
build_flags = 
    ${stm32_base.build_flags}
    -D DUAL_LRS_ROLE_AIR=1

[env:dual_lrs_ground]
extends = stm32_base
build_flags = 
    ${stm32_base.build_flags}
    -D DUAL_LRS_ROLE_GROUND=1

[env:dual_lrs_ground_esp32]
platform = espressif32
board = esp32dev
board_build.flash_mode = dio
upload_speed = 115200
build_flags = 
    -D DUAL_LRS_ROLE_GROUND=1
    -O2
    -std=gnu++17
    -I include
